<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khóa học của tôi</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <a class="brand" href="index.html">
        <span class="brand-mark">CM</span>
        <span>Cổng lưu trữ thông tin khóa học</span>
      </a>
      <nav class="main-nav">
        <a href="index.html" data-nav>Giới thiệu</a>
        <a href="courses.html" data-nav>Khóa học</a>
        <a href="student.html" data-nav>Học sinh</a>
        <a href="teacher.html" data-nav>Giáo viên</a>
        <a href="management.html" data-nav>Quản lý</a>
        <a href="statistics.html" data-nav>Thống kê</a>
      </nav>
      <div class="header-actions">
        <span class="btn" data-username>Tài khoản</span>
        <button class="btn red" data-logout>Đăng xuất</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="breadcrumb">Trang chủ › Khóa học của tôi</div>
    <section class="hero-strip">
      <div>
        <div class="eyebrow">Học liệu số</div>

      </div>
      <div class="stats">
        <div class="stat"><div><strong>0</strong><span>đang học</span></div></div>
        <div class="stat"><div><strong>0</strong><span>hoàn thành</span></div></div>
      </div>
    </section>

    <section class="my-courses">
      <div class="my-courses-title">
        <h2>Danh sách đã đăng ký</h2>
        <a class="btn" href="courses.html">Tìm khóa học</a>
      </div>
      <table class="table">
        <thead>
          <tr>
            <th>Khóa học</th>
            <th>Trạng thái</th>
            <th>Tiến độ</th>
            <th>Ngày đăng ký</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody id="myCourseRows">
          <tr><td colspan="5">Đang tải dữ liệu...</td></tr>
        </tbody>
      </table>
    </section>
  </main>
  <script src="assets/js/app.js"></script>
