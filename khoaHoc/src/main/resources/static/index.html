<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cổng quản lý khóa học</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
    <div class="header-inner">
        <a class="brand" href="index.html"><span class="brand-mark">CM</span><span>Cổng khóa học</span></a>
        <nav class="main-nav">
            <a href="index.html" data-nav>Khóa học</a>
            <a href="dashboard.html" data-nav data-auth-only style="display:none">Của tôi</a>
            <a href="dashboard.html?view=profile" data-nav data-auth-only style="display:none">Hồ sơ</a>
        </nav>
        <div class="header-actions">
            <a class="btn" href="auth.html" data-guest-only>Đăng nhập</a>
            <a class="btn red" href="auth.html?tab=register" data-guest-only>Đăng ký</a>
            <span class="btn" data-auth-only style="display:none"><span data-username>Tài khoản</span> <span class="badge gray" data-role-badge></span></span>
            <button class="btn red" data-logout data-auth-only style="display:none">Đăng xuất</button>
        </div>
    </div>
</header>

<main class="page">
    <div class="category-tabs" id="categoryTabs">
        <button class="active" data-cat="">Tất cả</button>
    </div>

    <div class="search-toolbar">
        <input class="field" id="searchInput" placeholder="Tìm khóa học...">
        <select class="field" id="sortSelect">
            <option value="createdAt,desc">Mới nhất</option>
            <option value="price,asc">Giá tăng dần</option>
            <option value="price,desc">Giá giảm dần</option>
        </select>
    </div>

    <div class="course-grid" id="courseGrid">
        <div class="empty-state">Đang tải khóa học...</div>
    </div>

    <div class="pager" id="pager"></div>
</main>

<script src="js/app.js"></script>
</body>
</html>
