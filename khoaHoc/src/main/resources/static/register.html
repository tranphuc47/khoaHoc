<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - Cổng quản lý khóa học</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
    <div class="header-inner">
        <a class="brand" href="index.html"><span class="brand-mark">CM</span><span>Cổng quản lý khóa học</span></a>
        <nav class="main-nav">
            <a href="index.html" data-nav>Trang chủ</a>
            <a href="courses.html" data-nav>Khóa học</a>
        </nav>
        <div class="header-actions">
            <a class="btn" href="login.html" data-guest-only>Đăng nhập</a>
            <a class="btn red" href="register.html" data-guest-only>Đăng ký</a>
        </div>
    </div>
</header>

<main class="page">
    <div class="breadcrumb">Trang chủ › Đăng ký</div>

    <section class="auth-layout">
        <div class="intro-panel">
            <div class="eyebrow">Tham gia miễn phí</div>
            <h1>Tạo tài khoản mới</h1>
            <p>Tài khoản đăng ký mới mặc định có vai trò <strong>Học viên</strong>.
                Nếu bạn là giảng viên, liên hệ Quản trị viên để được nâng quyền sau khi đăng ký.</p>
        </div>

        <div class="auth-card">
            <h2>Đăng ký</h2>
            <form class="form-stack" id="registerForm">
                <input class="field" type="text" id="username" placeholder="Tên đăng nhập" required>
                <input class="field" type="email" id="email" placeholder="Email" required>
                <input class="field" type="password" id="password" placeholder="Mật khẩu (tối thiểu 6 ký tự)" required minlength="6">
                <input class="field" type="text" id="fullName" placeholder="Họ và tên" required>
                <input class="field" type="text" id="phone" placeholder="Số điện thoại">
                <button class="btn red" type="submit">Đăng ký</button>
            </form>
            <div class="message" id="registerMessage"></div>
            <p style="margin-top:16px;color:var(--muted)">
                Đã có tài khoản? <a href="login.html" style="color:var(--blue);font-weight:800">Đăng nhập</a>
            </p>
        </div>
    </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
