<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập / Đăng ký</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
    <div class="header-inner">
        <a class="brand" href="index.html"><span class="brand-mark">CM</span><span>Cổng khóa học</span></a>
        <nav class="main-nav">
            <a href="index.html" data-nav>Khóa học</a>
        </nav>
        <div class="header-actions"></div>
    </div>
</header>

<main class="page" style="max-width:440px">
    <div class="panel" style="margin-top:40px">
        <div class="auth-tabs">
            <button class="active" data-authtab="login">Đăng nhập</button>
            <button data-authtab="register">Đăng ký</button>
        </div>

        <form class="form-stack" id="loginForm">
            <input class="field" id="loginUsername" placeholder="Tên đăng nhập" required>
            <input class="field" id="loginPassword" type="password" placeholder="Mật khẩu" required>
            <button class="btn red" type="submit">Đăng nhập</button>
        </form>
        <div class="message" id="loginMessage"></div>

        <form class="form-stack" id="registerForm" style="display:none">
            <input class="field" id="regUsername" placeholder="Tên đăng nhập" required>
            <input class="field" id="regEmail" type="email" placeholder="Email" required>
            <input class="field" id="regPassword" type="password" placeholder="Mật khẩu (tối thiểu 6 ký tự)" required minlength="6">
            <input class="field" id="regFullName" placeholder="Họ và tên" required>
            <input class="field" id="regPhone" placeholder="Số điện thoại">
            <button class="btn red" type="submit">Đăng ký</button>
        </form>
        <div class="message" id="registerMessage"></div>
    </div>
</main>

<script src="js/app.js"></script>
</body>
</html>
