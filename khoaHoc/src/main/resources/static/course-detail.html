<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết khóa học</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
    <div class="header-inner">
        <a class="brand" href="index.html"><span class="brand-mark">CM</span><span>Cổng quản lý khóa học</span></a>
        <nav class="main-nav">
            <a href="index.html" data-nav>Trang chủ</a>
            <a href="courses.html" data-nav>Khóa học</a>
            <a href="my-courses.html" data-nav data-role="STUDENT">Khóa của tôi</a>
            <a href="teacher.html" data-nav data-role="INSTRUCTOR">Giảng viên</a>
            <a href="admin.html" data-nav data-role="ADMIN">Quản trị</a>
        </nav>
        <div class="header-actions">
            <a class="btn" href="login.html" data-guest-only>Đăng nhập</a>
            <a class="btn red" href="register.html" data-guest-only>Đăng ký</a>
            <a class="btn" href="my-courses.html" data-auth-only style="display:none"><span data-username>Tài khoản</span></a>
            <button class="btn red" data-logout data-auth-only style="display:none">Đăng xuất</button>
        </div>
    </div>
</header>

<main class="page">
    <div class="breadcrumb">Trang chủ › Khóa học › <span id="breadcrumbTitle">Chi tiết</span></div>

    <section class="hero-strip">
        <div>
            <div class="eyebrow" id="courseCategory">Danh mục</div>
            <h1 id="courseTitle">Đang tải...</h1>
        </div>
        <div class="stats">
            <div class="stat"><div><strong id="coursePrice">-</strong><span>học phí</span></div></div>
        </div>
    </section>

    <section class="panel" style="margin-top:20px">
        <p class="detail-copy" id="courseDescription">...</p>
        <div id="enrollBox"></div>
        <div class="message" id="enrollMessage"></div>
    </section>

    <section class="panel" style="margin-top:20px">
        <div class="section-head"><h2>Nội dung khóa học</h2></div>
        <div class="chapter-list" id="chapterList">
            <div class="empty-state">Đang tải nội dung...</div>
        </div>
    </section>
</main>

<script src="js/app.js"></script>
</body>
</html>
