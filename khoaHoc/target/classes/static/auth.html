<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập & Đăng ký — CourseHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
    <div class="header-inner">
        <a class="brand" href="index.html">
            <span class="brand-mark">CH</span>
            <span>CourseHub</span>
        </a>
        <nav class="main-nav">
            <a href="index.html" data-nav>Khóa học</a>
        </nav>
        <div class="header-actions">
            <a class="btn" href="index.html">Về trang chủ</a>
        </div>
    </div>
</header>

<main class="page" style="max-width: 460px; margin-top: 30px;">
    <div class="panel" style="box-shadow: var(--shadow-lg); border-radius: var(--radius-md);">
        <div style="text-align: center; margin-bottom: 24px;">
            <h2 style="color: var(--blue-dark); font-size: 22px; margin-bottom: 6px;">Chào mừng đến với CourseHub</h2>
            <p style="color: var(--text-muted); font-size: 14px;">Nền tảng học trực tuyến dành cho mọi đối tượng</p>
        </div>

        <div class="tabs" style="margin-bottom: 24px;">
            <button class="active" data-authtab="login" style="flex: 1; text-align: center;">Đăng nhập</button>
            <button data-authtab="register" style="flex: 1; text-align: center;">Đăng ký tài khoản</button>
        </div>

        <!-- Form Đăng Nhập -->
        <form class="form-stack" id="loginForm">
            <div>
                <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--text-muted);">Tên đăng nhập</label>
                <input class="field" id="loginUsername" placeholder="Nhập username" required>
            </div>
            <div>
                <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--text-muted);">Mật khẩu</label>
                <input class="field" id="loginPassword" type="password" placeholder="Nhập mật khẩu" required>
            </div>
            <button class="btn red" type="submit" style="width: 100%; height: 44px; margin-top: 8px;">Đăng nhập</button>
        </form>
        <div class="message" id="loginMessage"></div>

        <!-- Form Đăng Ký -->
        <form class="form-stack" id="registerForm" style="display:none">
            <div>
                <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--text-muted);">Tên đăng nhập *</label>
                <input class="field" id="regUsername" placeholder="Nhập tên tài khoản" required>
            </div>
            <div>
                <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--text-muted);">Địa chỉ Email *</label>
                <input class="field" id="regEmail" type="email" placeholder="example@gmail.com" required>
            </div>
            <div>
                <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--text-muted);">Mật khẩu *</label>
                <input class="field" id="regPassword" type="password" placeholder="Tối thiểu 6 ký tự" required minlength="6">
            </div>
            <div>
                <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--text-muted);">Họ và tên *</label>
                <input class="field" id="regFullName" placeholder="Nhập họ và tên đầy đủ" required>
            </div>
            <div>
                <label style="display:block; font-size:13px; font-weight:600; margin-bottom:6px; color:var(--text-muted);">Số điện thoại</label>
                <input class="field" id="regPhone" placeholder="Nhập số điện thoại">
            </div>
            <button class="btn red" type="submit" style="width: 100%; height: 44px; margin-top: 8px;">Đăng ký ngay</button>
        </form>
        <div class="message" id="registerMessage"></div>
    </div>
</main>

<div id="toastContainer" class="toast-container"></div>

<script src="js/app.js"></script>
</body>
</html>
