<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourseHub — Nền Tảng Học Trực Tuyến Hàng Đầu</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="app-header">
    <div class="header-inner">
        <a class="brand" href="index.html">
            <span class="brand-mark">CH</span>
            <span>CourseHub</span>
        </a>
        <nav class="main-nav">
            <a href="index.html" data-nav>Khóa học</a>
            <a href="dashboard.html" data-nav data-auth-only style="display:none">Khóa học của tôi</a>
            <a href="dashboard.html?view=profile" data-nav data-auth-only style="display:none">Hồ sơ cá nhân</a>
        </nav>
        <div class="header-actions">
            <a class="btn" href="auth.html" data-guest-only>Đăng nhập</a>
            <a class="btn red" href="auth.html?tab=register" data-guest-only>Đăng ký</a>
            <span class="btn" data-auth-only style="display:none">
                <span data-username>Tài khoản</span> 
                <span class="badge gray" data-role-badge></span>
            </span>
            <button class="btn red" data-logout data-auth-only style="display:none">Đăng xuất</button>
        </div>
    </div>
</header>

<main class="page">
    <section class="hero-banner">
        <h1>Khám Phá Các Khóa Học Chất Lượng Cao</h1>
        <p>Nâng cao kiến thức lập trình, thiết kế giao diện UI/UX và kỹ năng quản trị kinh doanh thực chiến ngay hôm nay.</p>
    </section>

    <!-- Module 2: Category Filter Tabs -->
    <div class="category-tabs" id="categoryTabs">
        <button class="active" data-cat="">Tất cả danh mục</button>
    </div>

    <!-- Module 3: Search & Sort Toolbar -->
    <div class="search-toolbar">
        <input class="field" id="searchInput" placeholder="🔍 Tìm kiếm khóa học theo tên hoặc từ khóa...">
        <select class="field" id="sortSelect">
            <option value="createdAt,desc">✨ Mới nhất</option>
            <option value="price,asc">💵 Giá tăng dần</option>
            <option value="price,desc">💎 Giá giảm dần</option>
        </select>
    </div>

    <!-- Module 3: Course Cards Grid -->
    <div class="course-grid" id="courseGrid">
        <div class="empty-state">Đang tải danh sách khóa học...</div>
    </div>

    <!-- Module 3: Pagination -->
    <div class="pager" id="pager"></div>
</main>

<div id="toastContainer" class="toast-container"></div>

<script src="js/app.js"></script>
</body>
</html>
